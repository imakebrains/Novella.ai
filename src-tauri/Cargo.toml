[package]
name = "app"
version = "0.2.0"
description = "Novella — a local-first writing environment"
authors = ["The Novella authors"]
license = "Apache-2.0"
repository = "https://github.com/imakebrains/Novella.ai"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# image-png: so the window icon can be set from a real PNG at startup.
# See the set_icon call in lib.rs for why the window needs its own icon.
tauri = { version = "2.11.3", features = ["image-png"] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
# OS credential store for provider API keys (Windows Credential Manager /
# macOS Keychain / Linux keyutils). Platform backends are opt-in features.
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
