# Publishes the web build to GitHub Pages on every push to main.
#
# Novella is a local-first app, so the hosted build is not a service — it's
# a way to try it without installing anything, and (once the responsive
# pass lands) to add it to a phone's home screen. Projects live in the
# visitor's own browser storage; nothing is sent anywhere.
#
# Requires one repo setting: Settings → Pages → Source = GitHub Actions.
name: Deploy web build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A queued deploy should replace an in-flight one, not stack behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/configure-pages@v5

      - run: npm ci

      # Same gate as the release job — a red build must never reach Pages.
      - run: npm run verify

      - run: npm run build:web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
